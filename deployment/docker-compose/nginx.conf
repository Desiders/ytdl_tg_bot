user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log off;

    server {
        listen 8080;
        server_tokens off;

        location / {
            root /var/lib/telegram-bot-api;
            dav_methods DELETE;
            autoindex off;
        }
    }
}
