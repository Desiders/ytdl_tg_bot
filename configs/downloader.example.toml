[server]
address = "0.0.0.0:50051"
max_concurrent = 5

[auth]
node_tokens = ["secret-token-a"]
cookie_manager_token = "secret-token-b"

[tls]
ca_cert_path = "tls/ca.crt"
cert_path = "tls/node.crt"
key_path = "tls/node.key"

[yt_dlp]
command = ["python3", "-m", "yt_dlp"]
max_file_size = 5000000
extractor_args = "youtube:player_client=default,mweb;player_skip=configs,initial_data;use_ad_playback_context=true"

[gallery_dl]
command = ["python3", "-m", "gallery_dl"]

[[replace_domains.video]]
from = '^(?:.*\.)?instagram\.(tv|net|com|org)$|^instagr\.am$'
to = "vxinstagram.com"

[[replace_domains.video]]
from = '^(?:.*\.)?twitter\.com$'
to = "fxtwitter.com"

[[replace_domains.video]]
from = '^(?:.*\.)?x\.com$'
to = "fixupx.com"

[[replace_domains.video]]
from = '^(?:.*\.)?bsky\.app$'
to = "fxbsky.app"

[[replace_domains.audio]]
from = '^(?:.*\.)?instagram\.(tv|net|com|org)$|^instagr\.am$'
to = "vxinstagram.com"

[[replace_domains.audio]]
from = '^(?:.*\.)?twitter\.com$'
to = "fxtwitter.com"

[[replace_domains.audio]]
from = '^(?:.*\.)?x\.com$'
to = "fixupx.com"

[[replace_domains.audio]]
from = '^(?:.*\.)?bsky\.app$'
to = "fxbsky.app"

# [[replace_domains.photo]]
# from = '...'
# to = '...'

# Custom `User-Agent` passed to yt-dlp per domain. Subdomains are matched too, so `tiktok.com`
# also covers `vt.tiktok.com`. The first matching rule wins.
[[user_agents]]
domains = ["tiktok.com"]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

[yt_pot_provider]
url = "http://yt-pot-provider:4416"
# url = "http://127.0.0.1:4416"

[spotdl]
enabled = false
command = ["spotdl"]

# Resolve Instagram/Facebook links to direct media via snapsave.app (cookie-free), replacing the
# vxinstagram domain-replace. On failure/disabled, falls back to that rule.
[snapsave]
enabled = false
# proxy = "socks5://127.0.0.1:1080"

[songrec]
enabled = false
command = ["songrec"]
max_audio_size = 26214400

[logging]
dirs = "info,downloader::grpc::capabilities=warn"
